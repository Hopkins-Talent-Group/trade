version: "3.9"

services:
  # --- Backend API (FastAPI) ---
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - DEBUG=true
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./cpp_engine:/app/cpp_engine:ro
    networks:
      - trade-net

  # --- Frontend (Next.js) ---
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - trade-net

  # --- Database (PostgreSQL + TimescaleDB) ---
  db:
    image: timescale/timescaledb:latest-pg16
    ports:
      - "5432:5432"
    env_file:
      - .env.example
    volumes:
      - trade-db-data:/var/lib/postgresql/data
    networks:
      - trade-net

  # --- Redis (cache + Celery broker) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - trade-net

  # --- Celery Worker (async AI jobs, data ingestion) ---
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env.example
    depends_on:
      - backend
      - redis
      - db
    volumes:
      - ./backend:/app
    networks:
      - trade-net

  # --- C++ Engine (sidecar for risk math / regime filter) ---
  cpp-engine:
    build:
      context: .
      dockerfile: cpp_engine/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./cpp_engine:/app
    networks:
      - trade-net

volumes:
  trade-db-data:

networks:
  trade-net:
    driver: bridge
