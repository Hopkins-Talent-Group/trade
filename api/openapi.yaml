openapi: 3.1.0
info:
  title: Trading Analysis Intelligence API
  version: 1.0.0
  description: >
    Draft API contract for trading analysis intelligence and transaction provisioning.
    Read-only endpoints for market data, portfolio snapshots, events, research findings,
    transactions, orders, and positions. The transaction-plans endpoint submits plans
    for human review only; no autonomous order execution, modification, or cancellation.
    Provider integrations, authentication implementation, persistence, and deployment
    are not implemented by this specification.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; replace after deployment.
security:
  - bearerAuth: []
paths:
  /api/v1/instruments:
    get:
      summary: List verified instruments
      parameters:
        - in: query
          name: query
          schema: { type: string }
      responses:
        '200':
          description: Instrument directory
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { $ref: '#/components/schemas/Instrument' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/market/bars:
    get:
      summary: Retrieve normalized OHLCV bars
      parameters:
        - in: query
          name: instrument_id
          required: true
          schema: { type: string }
        - in: query
          name: interval
          required: true
          schema: { enum: [1m, 5m, 15m, 30m, 1h, 1d, 1w, 1mo] }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200':
          description: Market bars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketBarPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/macro/observations:
    get:
      summary: Retrieve normalized macro observations
      parameters:
        - in: query
          name: series_id
          required: true
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: to
          schema: { type: string }
      responses:
        '200':
          description: Macro observations
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { type: object } }
  /api/v1/events:
    get:
      summary: Retrieve financial intelligence events
      parameters:
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: Event records
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { type: object } }
  /api/v1/portfolio/snapshots:
    get:
      summary: Retrieve authorized user's read-only portfolio snapshots
      responses:
        '200':
          description: Portfolio snapshots
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/research/findings:
    get:
      summary: Retrieve research findings
      parameters:
        - in: query
          name: review_status
          schema:
            enum: [draft, under_review, approved_for_research_use, rejected, superseded]
      responses:
        '200':
          description: Research findings
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { type: object } }
  /api/v1/transactions:
    get:
      summary: Retrieve transaction ledger records
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: instrument_id
          schema: { type: string }
        - in: query
          name: status
          schema: { enum: [filled, partial, cancelled, expired] }
      responses:
        '200':
          description: Transaction ledger entries
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/orders:
    get:
      summary: Retrieve order status (read-only, no execution)
      parameters:
        - in: query
          name: instrument_id
          schema: { type: string }
        - in: query
          name: status
          schema: { enum: [pending, filled, partial, cancelled, expired] }
      responses:
        '200':
          description: Order records
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { $ref: '#/components/schemas/Order' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/positions:
    get:
      summary: Retrieve current position state
      responses:
        '200':
          description: Position state
          content:
            application/json:
              schema:
                type: object
                required: [schema_version, data]
                properties:
                  schema_version: { const: '1.0.0' }
                  data: { type: array, items: { $ref: '#/components/schemas/Position' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/transaction-plans:
    post:
      summary: Submit a transaction plan for human review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instrument_id, side, quantity, price, user_approval]
              properties:
                instrument_id: { type: string }
                side: { enum: [BUY, SELL] }
                quantity: { type: integer, format: int64 }
                price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
                timestamp: { type: string, format: date-time }
                thesis: { type: string }
                evidence: { type: string }
                human_approval: { type: boolean }
      responses:
        '201':
          description: Transaction plan submitted for review
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id: { type: string }
                  status: { enum: [submitted, under_review, approved, rejected] }
                  submitted_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid query parameters
    Unauthorized:
      description: Authentication required
  schemas:
    Instrument:
      type: object
      required: [instrument_id, symbol, currency, identity_status]
      properties:
        instrument_id: { type: string }
        symbol: { type: string }
        issuer: { type: [string, 'null'] }
        venue: { type: [string, 'null'] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        identity_status: { enum: [verified, pending_verification, rejected] }
    MarketBarPage:
      type: object
      required: [schema_version, data, pagination]
      properties:
        schema_version: { const: '1.0.0' }
        data:
          type: array
          items: { type: object, description: Normalized market bar matching schemas/market-bar.schema.json }
        pagination:
          type: object
          required: [next_cursor]
          properties:
            next_cursor: { type: [string, 'null'] }
    Transaction:
      type: object
      required: [transaction_id, instrument_id, side, quantity, price, gross_amount, fees, net_cash_flow, status, recorded_at]
      properties:
        transaction_id: { type: string }
        instrument_id: { type: string }
        symbol: { type: string }
        side: { enum: [BUY, SELL] }
        quantity: { type: integer, format: int64 }
        price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        gross_amount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        fees: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        net_cash_flow: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { enum: [filled, partial, cancelled, expired] }
        evidence_status: { enum: [user_reported, verified, unverified] }
        realized_pnl: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        recorded_at: { type: string, format: date-time }
        source: { type: string }
    Order:
      type: object
      required: [order_id, instrument_id, side, quantity, price, status, created_at]
      properties:
        order_id: { type: string }
        instrument_id: { type: string }
        symbol: { type: string }
        side: { enum: [BUY, SELL] }
        quantity: { type: integer, format: int64 }
        price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        status: { enum: [pending, filled, partial, cancelled, expired] }
        filled_quantity: { type: integer, format: int64 }
        average_fill_price: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        time_in_force: { enum: [DAY, GTC, IOC, FOK] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        evidence_status: { enum: [user_reported, verified, unverified] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source: { type: string }
    Position:
      type: object
      required: [instrument_id, shares_held, average_cost_per_share, currency]
      properties:
        instrument_id: { type: string }
        symbol: { type: string }
        shares_held: { type: integer, format: int64 }
        average_cost_per_share: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        open_buy_orders: { type: integer, format: int64 }
        open_sell_orders: { type: integer, format: int64 }
        available_cash: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        reserved_for_orders: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        exposure_percent: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        maximum_acceptable_loss: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        evidence_status: { enum: [user_reported, verified, unverified] }
        last_updated: { type: string, format: date-time }
        source: { type: string }
